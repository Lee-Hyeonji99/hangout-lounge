<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>hangout-lounge</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  /* 더블탭/더블클릭으로 브라우저 확대(핀치줌 제스처로 인식)되고 다시
     축소가 안 되는 문제 제보 — 캔버스(renderer.domElement)엔 이미
     touch-action:none을 걸어뒀지만 그건 캔버스 영역에만 적용되고,
     UI 버튼/빈 배경 등 페이지 전체에서 더블탭하면 여전히 브라우저
     기본 줌 제스처가 걸릴 수 있어서 문서 전체에 적용. manipulation은
     더블탭 확대만 막고 한 손가락 탭/스크롤은 그대로 둔다. */
  html,body{touch-action:manipulation}
  body{background:#111;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}
  #topBar{position:absolute;left:14px;right:14px;
    top:calc(14px + env(safe-area-inset-top,0px));
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  #hintToggleBtn{width:32px;height:32px;border-radius:50%;flex-shrink:0;
    background:#0009;border:1px solid #567;color:#cde;font-size:15px;
    cursor:pointer;display:flex;align-items:center;justify-content:center}
  #hintToggleBtn:hover{background:#234}
  /* ---- 연결 상태 불안정 신호 아이콘(끊김 신호에 사선, 깜빡임) ----
     인터넷 자체가 끊겼거나(navigator.onLine) 연결된 상대로부터 한동안
     데이터가 안 와서(아래 STALE_PEER_TIMEOUT보다 짧은 경고 임계값) 곧
     끊길 것 같을 때만 나타난다 — 평소엔 아예 안 보임([hidden] 기본). */
  #connWarnIcon{width:32px;height:32px;border-radius:50%;flex-shrink:0;
    background:#5a1f1fcc;border:1px solid #d66;color:#fbb;
    display:flex;align-items:center;justify-content:center;
    animation:connWarnBlink 1.1s ease-in-out infinite}
  #connWarnIcon[hidden]{display:none}
  @keyframes connWarnBlink{0%,100%{opacity:1}50%{opacity:0.35}}
  #hint{font-size:13px;color:#bbb;
    background:#0008;padding:8px 12px;border-radius:8px;pointer-events:none;max-width:420px;
    transition:opacity 0.3s,transform 0.3s}
  #hint.collapsed{opacity:0;transform:translateY(-6px);position:absolute;pointer-events:none}
  /* ---- 우측 상단 방 정보(방 번호/인원수만) ----
     예전엔 내 ID/닉네임/연결된 상대 목록/입퇴장 로그까지 다 여기 쌓여
     있어서 사람이 많아지면(연결된 상대 목록이 길어지면) 이 상자 자체의
     크기가 계속 달라졌다 — "연결된 사람 많아도 이 크기 유지되어야 함"
     요청으로 방 번호·인원수라는 항상 짧은 텍스트만 남기고 나머지(내 ID/
     닉네임 변경/접속자 목록)는 아래 #peoplePopover로, 로그는 토스트만
     남기고 없앴다(#netPanel 자체는 이제 내용 길이가 거의 고정이라 크기도
     안정적). */
  #netPanel{font-size:13px;color:#ddd;flex-shrink:0;
    background:#0009;padding:8px 12px;border-radius:8px;white-space:nowrap}
  #utilBar{display:flex;gap:8px;flex-shrink:0}
  .iconBtn{width:32px;height:32px;border-radius:50%;flex-shrink:0;
    background:#0009;border:1px solid #567;color:#cde;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .iconBtn:hover{background:#234}
  .popover{position:absolute;right:14px;
    top:calc(50px + env(safe-area-inset-top,0px));
    background:#1c1c22;border:1px solid #445;border-radius:10px;
    padding:10px 12px;width:220px;max-width:calc(100vw - 28px);
    font-size:12px;color:#ddd;display:flex;flex-direction:column;gap:6px;z-index:6}
  .popover[hidden]{display:none}
  .popover textarea, .popover input{font:inherit;padding:5px 7px;border-radius:5px;
    border:1px solid #555;background:#222;color:#eee;resize:vertical;width:100%}
  .popover button{font:inherit;padding:5px 9px;border-radius:5px;border:1px solid #567;
    background:#234;color:#cde;cursor:pointer}
  .popover button:hover{background:#345}
  #bugReportStatus{font-size:10px;color:#8fd;min-height:12px}
  /* ---- 외형 꾸미기: 게임 화면을 안 가리는 모달로(예전엔 우측 패널에 늘
     펼쳐져 있어서 시야를 가린다는 피드백으로 변경) ---- */
  #appearanceModal{position:fixed;inset:0;background:#000a;z-index:11;
    display:flex;align-items:center;justify-content:center;padding:20px}
  #appearanceModal[hidden]{display:none}
  #appearanceBox{background:#1c1c22;border:1px solid #445;border-radius:14px;
    padding:18px 20px;max-width:360px;width:100%;max-height:85vh;overflow-y:auto;
    color:#ddd;font-size:13px}
  #appearanceHeader{display:flex;justify-content:space-between;align-items:center;
    font-size:15px;color:#fff;margin-bottom:4px}
  #appearanceHeader button{background:none;border:none;color:#9ab;cursor:pointer;
    padding:4px}
  #appearanceHeader button:hover{color:#fff}
  .appearanceLabel{font-size:11px;color:#789;margin-top:12px}
  .appearanceRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .styleBtn{width:44px;height:44px;padding:0;border-radius:8px;border:2px solid #445;
    background:#242430;color:#cde;display:flex;align-items:center;justify-content:center;
    cursor:pointer}
  .styleBtn:hover{background:#2e2e3c}
  .styleBtn.selected{border-color:#8fd;background:#2a3b38}
  .colorSwatch{width:28px;height:28px;border-radius:50%;border:2px solid #567;
    padding:0;cursor:pointer}
  .colorSwatch.selected{border-color:#fff;box-shadow:0 0 0 2px #8fd}

  /* ---- 입장/퇴장 토스트 + 로그 ---- */
  #toastLayer{position:absolute;left:50%;transform:translateX(-50%);
    top:calc(70px + env(safe-area-inset-top,0px));
    display:flex;flex-direction:column;gap:6px;align-items:center;
    pointer-events:none;z-index:5}
  .toast{background:#0009;color:#eee;font-size:12px;padding:6px 12px;
    border-radius:8px;border:1px solid #456;opacity:0;
    transform:translateY(-6px);transition:opacity 0.25s,transform 0.25s}
  .toast.show{opacity:1;transform:translateY(0)}
  #myId{font-family:monospace;color:#8fd}

  /* ---- 채팅(우측 하단 고정) ----
     예전엔 우측 상단 정보 패널(#netPanel) 안에 있었는데, PC에서 "채팅창
     위치를 바꾸는 게 좋겠다(오른쪽 아래)"는 요청으로 독립된 패널로
     분리했다 — 담배 버튼 바로 위(감정표현 메뉴가 뜨는 높이와 동일한
     오프셋)에 자리잡아서 다른 하단 UI와 안 겹친다. */
  #chatPanel{position:absolute;right:14px;
    bottom:calc(24px + 56px + 14px + env(safe-area-inset-bottom,0px));
    width:230px;max-width:calc(100vw - 28px);
    background:#0009;padding:8px 10px;border-radius:8px;
    display:flex;flex-direction:column;gap:6px;z-index:4}
  #chatLog{font-size:12px;color:#ddd;max-height:110px;overflow-y:auto;
    display:flex;flex-direction:column;gap:3px}
  #chatLog b{color:#9cf;font-weight:600}
  #chatInputRow{display:flex;gap:6px}
  #chatInput{flex:1;min-width:0;font:inherit;padding:5px 7px;border-radius:5px;
    border:1px solid #555;background:#222;color:#eee}
  #chatSendBtn{width:32px;height:32px;flex-shrink:0;border-radius:6px;
    border:1px solid #567;background:#234;color:#cde;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  #chatSendBtn:hover{background:#345}
  #peerList{font-size:11px;color:#9ab}

  /* ---- 모바일 터치 조이스틱(왼쪽 아래 고정, PC 키보드 입력과 병행 동작) ---- */
  #joystick{position:absolute;left:24px;
    bottom:calc(24px + env(safe-area-inset-bottom,0px));
    width:110px;height:110px;border-radius:50%;
    background:#0006;border:2px solid #456;touch-action:none;user-select:none}
  #joystickKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;
    margin:-23px 0 0 -23px;border-radius:50%;background:#345c;border:2px solid #8ac;
    pointer-events:none}

  /* ---- 담배 버튼(오른쪽 아래, 이동 스틱과 대칭) ---- */
  #smokeBtn{position:absolute;right:24px;
    bottom:calc(24px + env(safe-area-inset-bottom,0px));
    width:56px;height:56px;border-radius:50%;
    background:#0006;border:2px solid #456;color:#cde;
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  #smokeBtn:hover{background:#234}
  #smokeBtn.active{background:#8a4a2ac0;border-color:#e8703a;color:#fde}

  /* ---- 감정표현 버튼 + 메뉴(가운데 아래) ---- */
  #emoteBtn{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(24px + env(safe-area-inset-bottom,0px));
    width:56px;height:56px;border-radius:50%;
    background:#0006;border:2px solid #456;color:#cde;
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  #emoteBtn:hover{background:#234}
  #emoteMenu{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(24px + 56px + 14px + env(safe-area-inset-bottom,0px));
    display:flex;gap:8px;background:#0009;padding:8px;border-radius:12px;
    border:1px solid #456}
  #emoteMenu[hidden]{display:none}
  #emoteMenu button{width:42px;height:42px;border-radius:8px;border:1px solid #567;
    background:#234;color:#cde;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #emoteMenu button:hover{background:#345}

  /* ---- 좁은 화면(모바일)용 메뉴 토글 버튼 ----
     기본은 숨김(데스크톱은 패널이 항상 보임) — 아래 미디어쿼리가 좁은
     화면에서만 이 버튼을 보여주고 패널은 기본 접어둔다("패널이 너무 크다"
     피드백 대응). */
  @media (max-width:520px){
    #topBar{flex-direction:column}
    #hint{font-size:12px;max-width:none;padding:6px 9px}
    #netPanel{font-size:12px;padding:6px 10px}
  }

  /* ---- 닉네임 입장 게이트(docs/PLAN.md 6-a) ---- */
  #nameGate{position:fixed;inset:0;background:#000c;display:flex;
    align-items:center;justify-content:center;z-index:10}
  #nameGate[hidden]{display:none}
  #nameGateBox{background:#1c1c22;border:1px solid #445;border-radius:12px;
    padding:22px 26px;display:flex;flex-direction:column;gap:10px;min-width:240px}
  #nameGateBox label{font-size:13px;color:#bbb}
  #nameGateBox input{font:inherit;font-size:15px;padding:8px 10px;border-radius:6px;
    border:1px solid #555;background:#222;color:#eee}
  #nameGateBox button{font:inherit;padding:8px 10px;border-radius:6px;border:1px solid #567;
    background:#234;color:#cde;cursor:pointer}
  #nameGateBox button:hover{background:#345}

  #nicknameDisplay{color:#fd8}
  #changeNicknameBtn{font-size:11px;padding:2px 7px !important}

  /* ---- 아바타 머리 위 닉네임 라벨 + 채팅 말풍선 ----
     예전엔 닉네임 라벨 하나를 채팅 중엔 "닉네임: 메시지"로 통째로
     바꿔치기했는데, 그러면 글자 수가 늘어난 만큼 폭이 넓어져서 근처에
     서 있는 다른 사람 이름표를 가리는 문제가 있었다(제보됨: "말풍선
     위치때문에 다른사람 이름표를 가림"). 닉네임(.nameLabel)은 항상
     그대로 두고, 말풍선(.chatBubble)을 그 위에 별도로 쌓아서(둘 다 같은
     .nameLabelWrap 안에서 아래→위 순서) 닉네임을 안 가리게 하고, 말풍선
     자체도 word-wrap으로 최대 폭을 제한해서 옆 사람 쪽으로 무한정
     넓어지지 않게 했다. */
  #labelLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .nameLabelWrap{position:absolute;left:0;top:0;display:flex;
    flex-direction:column-reverse;align-items:center;gap:4px}
  .nameLabel{background:#0009;color:#fff;
    font-size:12px;padding:2px 7px;border-radius:6px;white-space:nowrap;
    border:1px solid transparent}
  /* 그 사람 연결이 불안정할 때(PEER_UNSTABLE_TIMEOUT) 이름표만 따로
     표시 — 전역 경고 아이콘과 같은 깜빡임 애니메이션(connWarnBlink)을
     재사용해서 톤을 통일. */
  .nameLabel.unstable{background:#5a3f1fcc;border-color:#d99;color:#fed;
    animation:connWarnBlink 1.1s ease-in-out infinite}
  .chatBubble{background:#1c1c22ee;color:#fff;border:1px solid #445;
    font-size:12px;padding:5px 9px;border-radius:10px;
    max-width:160px;white-space:normal;word-break:break-word;text-align:center;
    opacity:0;transform:translateY(4px);
    transition:opacity 0.2s,transform 0.2s}
  .chatBubble.show{opacity:1;transform:translateY(0)}
</style>
<script type="importmap">
{ "imports": { "three": "./lib/vendor/three/build/three.module.js" } }
</script>
<script src="./lib/vendor/peerjs/peerjs.min.js"></script>
</head>
<body>
<div id="topBar">
<button id="hintToggleBtn" title="조작법">?</button>
<div id="connWarnIcon" title="연결 상태가 불안정합니다" hidden>
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 8.82a15 15 0 0 1 20 0"></path>
    <path d="M5 12.86a10 10 0 0 1 14 0"></path>
    <path d="M8.5 16.9a5 5 0 0 1 7 0"></path>
    <line x1="12" y1="20" x2="12.01" y2="20"></line>
    <line x1="1" y1="1" x2="23" y2="23"></line>
  </svg>
</div>
<div id="hint" class="collapsed">WASD 또는 왼쪽 아래 조이스틱으로 이동, 벤치를 클릭/탭하면 앉는다.
  오른쪽 아래 버튼(또는 F)으로 담배 피기 — 둘 다 움직이면 자동으로 풀린다.
  접속하면 매칭 서버가 빈 방에 자동으로 넣어준다.</div>
<div id="utilBar">
  <button id="appearanceOpenBtn" class="iconBtn" title="외형 꾸미기">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="8.5" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="8.5" cy="13" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="15" cy="14.5" r="1.4" fill="currentColor" stroke="none"></circle></svg>
  </button>
  <button id="bugReportToggleBtn" class="iconBtn" title="버그 신고">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="8" width="10" height="10" rx="4"></rect><path d="M7 12H4M20 12h-3M9.5 4.5 8 7M14.5 4.5 16 7M4.5 16 7 15M19.5 16 17 15"></path></svg>
  </button>
  <button id="manualConnectToggleBtn" class="iconBtn" title="수동 연결(매칭 서버 없을 때만)">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15 15 9"></path><path d="M11 6.5 12.3 5.2a3 3 0 0 1 4.3 4.3L15.3 11"></path><path d="M13 17.5 11.7 18.8a3 3 0 0 1-4.3-4.3L8.7 13"></path></svg>
  </button>
  <button id="peopleToggleBtn" class="iconBtn" title="접속자 목록">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"></path><circle cx="17" cy="9" r="2.4"></circle><path d="M15.5 14c2.3.2 4 1.9 4 4.5"></path></svg>
  </button>
</div>
<div id="bugReportPopover" class="popover" hidden>
  <textarea id="bugReportText" rows="3" maxlength="500"
    placeholder="어떤 상황에서 뭐가 이상했는지 적어주세요"></textarea>
  <button id="bugReportSendBtn">신고 보내기</button>
  <div id="bugReportStatus"></div>
</div>
<div id="manualConnectPopover" class="popover" hidden>
  <input id="remoteIdInput" placeholder="상대 ID 붙여넣기">
  <button id="connectBtn">연결</button>
</div>
<div id="peoplePopover" class="popover" hidden>
  내 ID: <span id="myId">연결 중…</span>
  <div>닉네임: <span id="nicknameDisplay"></span>
    <button id="changeNicknameBtn">변경</button></div>
  <div id="peerList">연결된 상대: 없음</div>
</div>
<div id="netPanel">
  <span id="roomSummary">방 배정 중…</span>
</div>
</div>
<div id="chatPanel">
  <div id="chatLog"></div>
  <div id="chatInputRow">
    <input id="chatInput" placeholder="메시지 입력" maxlength="200">
    <button id="chatSendBtn" title="전송">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 20 4 13 20 11 13 4 12Z"></path></svg>
    </button>
  </div>
</div>
<div id="joystick" hidden><div id="joystickKnob"></div></div>
<button id="smokeBtn" title="담배 피기(F)">
  <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <rect x="3" y="12" width="14" height="4" rx="1"></rect>
    <path d="M17 13.2h3"></path>
    <path d="M15 8c0-1.4 1-1.6 1-3s-1-1.6-1-3"></path>
    <path d="M18.5 8c0-1.4 1-1.6 1-3s-1-1.6-1-3"></path>
  </svg>
</button>

<button id="emoteBtn" title="감정표현(E)">
  <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"></circle>
    <path d="M8.3 14c1 1.3 2.2 2 3.7 2s2.7-.7 3.7-2"></path>
    <circle cx="9" cy="9.6" r="0.9" fill="currentColor" stroke="none"></circle>
    <circle cx="15" cy="9.6" r="0.9" fill="currentColor" stroke="none"></circle>
  </svg>
</button>
<div id="emoteMenu" hidden>
  <button data-emote="Wave" title="손 흔들기">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 21v-7a4 4 0 0 1 8 0v3"></path>

<script type="module">
import * as THREE from 'three';
import { createMesh } from './lib/webrtc-mesh.js';

/* ---- 버그 리포트 → Jira 자동 이슈(api/bugreport.js) ----
   1) 자동: 잡히지 않은 JS 에러/프로미스 거부는 조용히 Jira 이슈로
      보고한다(같은 메시지는 서버 쪽에서 dedup). 실제 게임 로직/UX 버그
      (예: 조인 레이스, 방향키 반대)는 예외를 던지지 않아서 이걸로는
      못 잡는다 — 그래서 아래 2) 수동 신고가 따로 있다.
   2) 수동: 우측 패널 "버그 신고"에 사용자가 직접 쓴 글 → 곧바로 Jira
      이슈 생성. 매칭 서버(api/room.js)와 같은 방침 — 환경변수(Jira API
      토큰) 없으면 요청이 조용히 실패하고 게임 자체엔 영향 없음. */
const reportedAutoErrors = new Set();
function reportBug(kind, message, extra){
  if(!message) return;
  if(kind === 'auto'){
    if(reportedAutoErrors.has(message)) return; // 같은 에러 반복 시 매번 요청 안 보냄(서버 dedup과 별개로 클라도 절약)
    reportedAutoErrors.add(message);
  }
  fetch('/api/bugreport', {
    method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ kind, message, url: location.href, userAgent: navigator.userAgent, ...extra }),
  }).catch(()=>{}); // 매칭 서버와 같은 방침 — 실패해도 게임엔 영향 없음
}
addEventListener('error', (e)=>{
  reportBug('auto', String(e.message || (e.error && e.error.message) || e.error || '알 수 없는 에러'),
    { stack: e.error && e.error.stack });
});
addEventListener('unhandledrejection', (e)=>{
  const reason = e.reason;
  reportBug('auto', String((reason && reason.message) || reason || '알 수 없는 프로미스 거부'),
    { stack: reason && reason.stack });
});

/* ============================================================
   3단계 — docs/PLAN.md 8번. 같은 브라우저 2탭(또는 다른 기기)을 PeerJS로
   연결해서 위치/상태 동기화 + 보간이 실제로 부드러운지 확인한다.

   상태 동기화 설계는 docs/PLAN.md 4번 그대로:
   - 위치/회전: 초당 ~10회, 받는 쪽은 마지막 두 스냅샷을 보간(lerp)해서 그린다.
   - 상태 이름(Idle/Walk): 바뀔 때만 보낸다.
   지금은 프로토타입이라 한 DataConnection(기본 reliable 채널)에 둘 다
   실어 보낸다 — "unreliable 채널로 더 가볍게"는 나중 최적화 대상.
   ============================================================ */

/* ---- 닉네임 입장 게이트(docs/PLAN.md 6-a) ----
   서버 저장 없이 localStorage에만 남긴다 — 인증이 아니라 "화면에 이름
   표시"가 목적이라 이 정도로 충분하다는 결론. */
const NICKNAME_STORAGE_KEY = 'hangout-lounge:nickname';
function loadSavedNickname(){
  try { return localStorage.getItem(NICKNAME_STORAGE_KEY) || ''; }
  catch { return ''; } // 프라이빗 모드 등에서 localStorage가 막혀있을 수 있음
}
function saveNickname(name){
  try { localStorage.setItem(NICKNAME_STORAGE_KEY, name); } catch {}
}

function promptNickname(defaultValue){
  return new Promise((resolve)=>{
    const gate = document.getElementById('nameGate');
    const input = document.getElementById('nicknameInput');
    const btn = document.getElementById('nicknameSubmit');
    input.value = defaultValue || '';
    gate.hidden = false;
    input.focus();
    function submit(){
      const name = input.value.trim().slice(0,16) || '손님';
      btn.removeEventListener('click', submit);
      input.removeEventListener('keydown', onKey);
      gate.hidden = true;
      saveNickname(name);
      resolve(name);
    }
    function onKey(e){ if(e.key==='Enter') submit(); }
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', onKey);
  });
}

async function getNickname(){
  const saved = loadSavedNickname();
  if(saved) return saved;
  return promptNickname('');
}

/* ---- 외형 커스터마이징 저장 ----
   닉네임과 같은 이유로 서버 없이 localStorage에만 남긴다. DEFAULT_APPEARANCE는
   아래(HAMSTER_PALETTE 근처)에서 정의되지만, 이 함수들은 main() 시작 이후에나
   실제로 호출되므로 그때는 이미 다 정의돼 있다. */
const APPEARANCE_STORAGE_KEY = 'hangout-lounge:appearance';
function loadSavedAppearance(){
  try {
    const raw = localStorage.getItem(APPEARANCE_STORAGE_KEY);
    if(!raw) return { ...DEFAULT_APPEARANCE };
    return { ...DEFAULT_APPEARANCE, ...JSON.parse(raw) };
  } catch { return { ...DEFAULT_APPEARANCE }; }
}
function saveAppearance(appearance){
  try { localStorage.setItem(APPEARANCE_STORAGE_KEY, JSON.stringify(appearance)); } catch {}
}

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* ---- 하늘/안개 색 ----
   "공간이 무섭다(시커멓고 끝없어 보임)"는 피드백 — 배경이 단색 암흑이라
   지평선이 없어서 어디가 바닥이고 어디가 하늘인지 감이 안 왔던 게 원인으로
   보인다. SKY_HORIZON을 안개 색과 동일하게 맞춰서(고전적인 스카이박스
   기법) 먼 바닥이 하늘로 자연스럽게 이어져 보이게 한다. */
const SKY_TOP = 0x1b2a4a;     // 하늘 위쪽(어두운 남색)
const SKY_HORIZON = 0x5c6f88; // 지평선 근처(밝은 회청색) — 안개 색과 맞춤

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY_HORIZON);
scene.fog = new THREE.Fog(SKY_HORIZON, 20, 70); // 맵이 커져서 멀리 보이게 + 하늘색과 맞춰서 경계가 안 보이게

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 160);

const hemi = new THREE.HemisphereLight(0xffffff, 0x333333, 1.2);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(3, 6, 4);
scene.add(key);

/* ---- 하늘(스피어, 안쪽 면만 보이게) ----
   버텍스 컬러로 위(어두운 남색)→아래(지평선, 안개색과 동일)로 그라데이션만
   준다 — 텍스처/셰이더 없이 THREE 기본 기능만으로 충분하다. */
function buildSky(){
  const geo = new THREE.SphereGeometry(140, 24, 16);
  const top = new THREE.Color(SKY_TOP);
  const horizon = new THREE.Color(SKY_HORIZON);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  for(let i=0; i<pos.count; i++){
    const ny = pos.getY(i) / 140; // -1(바닥) ~ 1(꼭대기)
    const t = THREE.MathUtils.clamp(ny * 1.4 + 0.1, 0, 1); // 지평선 부근을 더 넓게
    const c = horizon.clone().lerp(top, t);
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.BackSide, fog:false});
  scene.add(new THREE.Mesh(geo, mat));
}
buildSky();

// 예전엔 아스팔트 같은 짙은 회색(0x2a2a30)이라 "무섭다"는 피드백을 받음 —
// 따뜻한 톤의 광장 바닥(플라자 포장재 느낌)으로 교체.
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(70, 48),
  new THREE.MeshStandardMaterial({color:0xa89a80, roughness:0.9})
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

/* ---- 벤치(카페/공원 어느 쪽이든 쓸 수 있는 범용 좌석 소품) ----
   나무 판(좌석+등받이) + 다리 4개, 전부 박스 지오메트리. 팔레트는 햄스터와
   겹치지 않는 나무/금속 톤 몇 가지로 고정(ART_STYLE 1번 — 색 즉석 생성 금지).
   기본 2인용 — group.userData.seatOffsets(길이 2)/seatYaw로 "앉았을 때
   아바타가 있어야 할 자리"를 벤치 로컬 좌표로 따로 들고 있어서, 벤치를 씬
   어디에 놓고 돌려도 앉기 좌표 계산이 그대로 맞게 한다.
   userData.collider(halfW/halfD)는 아래 resolveCollisions()가 통과
   막는 용도로 쓰는 벤치 주변 사각 범위(아바타 반경 포함해서 넉넉하게). */
const BENCH_PALETTE = { wood: 0xb98a55, woodDark: 0x8a6239, metal: 0x53585c };

function buildBench(){
  const woodMat  = new THREE.MeshStandardMaterial({color:BENCH_PALETTE.wood, roughness:0.8});
  const metalMat = new THREE.MeshStandardMaterial({color:BENCH_PALETTE.metal, roughness:0.6, metalness:0.3});

  const group = new THREE.Group();

  const seat = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.42), woodMat);
  seat.position.y = 0.42;
  group.add(seat);

  const back = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 0.08), woodMat);
  back.position.set(0, 0.67, -0.17);
  back.rotation.x = -0.15;
  group.add(back);

  const legGeo = new THREE.BoxGeometry(0.08, 0.42, 0.38);
  [-0.52, 0.52].forEach(x=>{
    const leg = new THREE.Mesh(legGeo, metalMat);
    leg.position.set(x, 0.21, 0);
    group.add(leg);
  });

  // 2인용 — 좌석 위, 등받이 반대쪽을 보고 앉게 살짝 앞쪽으로, 왼쪽/오른쪽에
  // 한 자리씩.
  group.userData.seatOffsets = [
    new THREE.Vector3(-0.3, 0.42, 0.1),
    new THREE.Vector3(0.3, 0.42, 0.1),
  ];
  group.userData.seatYaw = 0;
  group.userData.collider = { halfW: 0.68, halfD: 0.42 };

  return group;
}

const benches = [];
function placeBench(x, z, rotY){
  const bench = buildBench();
  bench.position.set(x, 0, z);
  bench.rotation.y = rotY;
  scene.add(bench);
  benches.push(bench);
  return bench;
}

function benchSeatWorld(bench, seatIndex){
  const local = bench.userData.seatOffsets[seatIndex].clone();
  local.applyAxisAngle(new THREE.Vector3(0,1,0), bench.rotation.y);
  return bench.position.clone().add(local);
}
function benchSeatYaw(bench){
  return bench.rotation.y + bench.userData.seatYaw;
}

/* ---- 소품 콜리전(벤치/나무/테이블을 그냥 통과해서 걸어다니던 문제) ----
   물리엔진 없이, 소품을 로컬 좌표계의 사각형(userData.collider)으로 보고 그
   안에 들어오면 가장 얕게 파고든 축으로 밀어내는 정도의 단순한 처리. 이
   프로젝트는 "정밀 물리 동기화 안 함"이 원칙(docs/PLAN.md 1번)이라 이 정도
   관대함이면 충분하다 — 내 아바타에만 적용하고(각자 클라이언트가 자기
   위치를 이렇게 보정), 남의 아바타는 보정된 위치가 그대로 네트워크로
   전달되니 손 안 대도 됨. colliders 배열은 아래에서 벤치/나무/카페 소품을
   다 만든 뒤 한 번에 채운다. */
const AVATAR_RADIUS = 0.28;
const colliders = [];
function resolveCollisions(pos){
  for(const obj of colliders){
    const { halfW, halfD } = obj.userData.collider;
    const local = pos.clone().sub(obj.position);
    local.applyAxisAngle(new THREE.Vector3(0,1,0), -obj.rotation.y);
    const w = halfW + AVATAR_RADIUS, d = halfD + AVATAR_RADIUS;
    if(Math.abs(local.x) < w && Math.abs(local.z) < d){
      const penX = w - Math.abs(local.x);
      const penZ = d - Math.abs(local.z);
      if(penX < penZ) local.x = Math.sign(local.x || 1) * w;
      else local.z = Math.sign(local.z || 1) * d;
      local.applyAxisAngle(new THREE.Vector3(0,1,0), obj.rotation.y);
      pos.copy(obj.position).add(local);
    }
  }
  return pos;
}

/* ---- 큰 맵: 공원 존 + 카페 존을 한 맵 안에 ----
   요청("전부 있는 큰 맵")대로 둘 중 하나를 고르지 않고 이어붙였다 — 왼쪽은
   공원(잔디 바닥 + 나무 + 벤치), 오른쪽은 카페(실내 톤 바닥 + 테이블/스툴),
   가운데는 공용 광장(기존 벤치 배치 자리). 팔레트는 벤치와 겹치는 톤은
   재사용하고(ART_STYLE 1번 — 색 즉석 생성 방지), 존별로 꼭 필요한 색만
   추가했다. */
const PARK_PALETTE = { grass: 0x4c7a4a, trunk: 0x6b4a34, leaf: 0x5a9152 };
const CAFE_PALETTE = { indoorFloor: 0x4a3428 };

function addGroundPatch(x, z, radius, color){
  const patch = new THREE.Mesh(
    new THREE.CircleGeometry(radius, 32),
    new THREE.MeshStandardMaterial({color, roughness:0.9})
  );
  patch.rotation.x = -Math.PI/2;
  patch.position.set(x, 0.01, z); // 베이스 바닥보다 살짝 띄워서 겹침(z-fighting) 방지
  scene.add(patch);
}

function buildTree(){
  const group = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12, 0.16, 1.1, 8),
    new THREE.MeshStandardMaterial({color:PARK_PALETTE.trunk, roughness:0.9})
  );
  trunk.position.y = 0.55;
  group.add(trunk);
  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(0.75, 10, 8),
    new THREE.MeshStandardMaterial({color:PARK_PALETTE.leaf, roughness:0.85})
  );
  leaves.position.y = 1.5;
  leaves.scale.set(1, 0.9, 1);
  group.add(leaves);
  group.userData.collider = { halfW:0.35, halfD:0.35 };
  return group;
}
const trees = [];
function placeTree(x, z){
  const tree = buildTree();
  tree.position.set(x, 0, z);
  scene.add(tree);
  trees.push(tree);
}

function buildCafeTable(){
  const woodMat = new THREE.MeshStandardMaterial({color:BENCH_PALETTE.wood, roughness:0.7});
  const metalMat = new THREE.MeshStandardMaterial({color:BENCH_PALETTE.metal, roughness:0.5, metalness:0.4});
  const group = new THREE.Group();
  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.06, 20), woodMat);
  top.position.y = 0.72;
  group.add(top);
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.7, 10), metalMat);
  leg.position.y = 0.35;
  group.add(leg);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.04, 16), metalMat);
  base.position.y = 0.03;
  group.add(base);
  group.userData.collider = { halfW:0.5, halfD:0.5 };
  return group;
}
function buildStool(){
  const seatMat = new THREE.MeshStandardMaterial({color:BENCH_PALETTE.woodDark, roughness:0.75});
  const legMat = new THREE.MeshStandardMaterial({color:BENCH_PALETTE.metal, roughness:0.5, metalness:0.4});
  const group = new THREE.Group();
  const seat = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.05, 16), seatMat);
  seat.position.y = 0.42;
  group.add(seat);
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.4, 8), legMat);
  leg.position.y = 0.2;
  group.add(leg);
  group.userData.collider = { halfW:0.22, halfD:0.22 };
  // 1인용 좌석 — 스툴 자체가 앉는 자리(벤치의 seatOffsets와 같은 방식,
  // benchSeatWorld/benchSeatYaw가 그대로 재사용됨). 몸을 향하게 할 실제
  // yaw는 테이블 쪽을 봐야 해서 배치 시점(placeCafeTable)에 계산해 넣는다.
  group.userData.seatOffsets = [ new THREE.Vector3(0, 0.42, 0) ];
  group.userData.seatYaw = 0;
  return group;
}
const cafeProps = []; // 테이블/스툴 — 콜리전용(테이블은 못 앉음)
const stools = []; // 스툴만 따로 — 벤치처럼 클릭해서 앉을 수 있음(버그로 제보돼 추가)
function placeCafeTable(x, z){
  const table = buildCafeTable();
  table.position.set(x, 0, z);
  scene.add(table);
  cafeProps.push(table);
  [[-0.65,0],[0.65,0],[0,-0.65],[0,0.65]].forEach(([dx,dz])=>{
    const stool = buildStool();
    stool.position.set(x+dx, 0, z+dz);
    // 스툴에 앉으면 테이블 쪽(=오프셋의 반대 방향)을 보게.
    const facing = new THREE.Vector3(-dx, 0, -dz);
    stool.userData.seatYaw = Math.atan2(facing.x, facing.z);
    scene.add(stool);
    cafeProps.push(stool);
    stools.push(stool);
  });
}
