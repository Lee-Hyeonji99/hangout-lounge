<html lang="ko">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>hangout-lounge</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#111;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}
  #topBar{position:absolute;left:14px;right:14px;
    top:calc(14px + env(safe-area-inset-top,0px));
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  #hint{font-size:13px;color:#bbb;
    background:#0008;padding:8px 12px;border-radius:8px;pointer-events:none;max-width:420px}
  #netPanel{font-size:13px;color:#ddd;flex-shrink:0;
    background:#0009;padding:10px 12px;border-radius:8px;display:flex;flex-direction:column;gap:6px;min-width:240px}
  #netPanel input{font:inherit;padding:5px 7px;border-radius:5px;border:1px solid #555;background:#222;color:#eee}
  #netPanel button{font:inherit;padding:5px 9px;border-radius:5px;border:1px solid #567;background:#234;color:#cde;cursor:pointer}
  #netPanel button:hover{background:#345}
  #manualConnect{font-size:11px;color:#9ab;margin-top:2px}
  #manualConnect summary{cursor:pointer}
  #manualConnect input{margin-top:6px;width:100%}
  #manualConnect button{margin-top:6px}
  #appearancePanel{font-size:11px;color:#9ab;margin-top:2px}
  #appearancePanel summary{cursor:pointer}

  .appearanceRow button{font-size:11px;padding:3px 7px}
  .appearanceRow button.selected{border-color:#8fd;color:#fff}

  #myId{font-family:monospace;color:#8fd}
  #roomInfo{font-size:11px;color:#9ab}

  /* ---- 모바일 터치 조이스틱(왼쪽 아래 고정, PC 키보드 입력과 병행 동작) ---- */
  #joystick{position:absolute;left:24px;
    bottom:calc(24px + env(safe-area-inset-bottom,0px));
    width:110px;height:110px;border-radius:50%;
    background:#0006;border:2px solid #456;touch-action:none;user-select:none}
  #joystickKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;
    margin:-23px 0 0 -23px;border-radius:50%;background:#345c;border:2px solid #8ac;
    pointer-events:none}

  /* ---- 담배 버튼(오른쪽 아래, 이동 스틱과 대칭) ---- */
  #smokeBtn{position:absolute;right:24px;
    bottom:calc(24px + env(safe-area-inset-bottom,0px));
    width:56px;height:56px;border-radius:50%;
    background:#0006;border:2px solid #456;color:#cde;
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  #smokeBtn:hover{background:#234}
  #smokeBtn.active{background:#8a4a2ac0;border-color:#e8703a;color:#fde}

  /* ---- 감정표현 버튼 + 메뉴(가운데 아래) ---- */
  #emoteBtn{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(24px + env(safe-area-inset-bottom,0px));
    width:56px;height:56px;border-radius:50%;
    background:#0006;border:2px solid #456;color:#cde;
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  #emoteBtn:hover{background:#234}
  #emoteMenu{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(24px + 56px + 14px + env(safe-area-inset-bottom,0px));
    display:flex;gap:8px;background:#0009;padding:8px;border-radius:12px;
    border:1px solid #456}
  #emoteMenu[hidden]{display:none}
  #emoteMenu button{width:42px;height:42px;border-radius:8px;border:1px solid #567;
    background:#234;color:#cde;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #emoteMenu button:hover{background:#345}

  @media (max-width:520px){
    #topBar{flex-direction:column}
    #hint{font-size:12px;max-width:none;padding:6px 9px}
    #netPanel{font-size:12px;min-width:0;width:100%;padding:8px 10px}
  }

  /* ---- 닉네임 입장 게이트(docs/PLAN.md 6-a) ---- */
  #nameGate{position:fixed;inset:0;background:#000c;display:flex;
    align-items:center;justify-content:center;z-index:10}
  #nameGate[hidden]{display:none}
  #nameGateBox{background:#1c1c22;border:1px solid #445;border-radius:12px;
    padding:22px 26px;display:flex;flex-direction:column;gap:10px;min-width:240px}
  #nameGateBox label{font-size:13px;color:#bbb}
  #nameGateBox input{font:inherit;font-size:15px;padding:8px 10px;border-radius:6px;
    border:1px solid #555;background:#222;color:#eee}
  #nameGateBox button{font:inherit;padding:8px 10px;border-radius:6px;border:1px solid #567;
    background:#234;color:#cde;cursor:pointer}
  #nameGateBox button:hover{background:#345}

  #nicknameDisplay{color:#fd8}
  #changeNicknameBtn{font-size:11px;padding:2px 7px !important}

  /* ---- 아바타 머리 위 닉네임 라벨 ---- */
  #labelLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .nameLabel{position:absolute;left:0;top:0;background:#0009;color:#fff;
    font-size:12px;padding:2px 7px;border-radius:6px;white-space:nowrap}
</style>
<script type="importmap">
{ "imports": { "three": "./lib/vendor/three/build/three.module.js" } }
</script>

<body>

<div id="hint">WASD 또는 왼쪽 아래 조이스틱으로 이동, 벤치를 클릭/탭하면 앉는다.
  오른쪽 아래 버튼(또는 F)으로 담배 피기 — 둘 다 움직이면 자동으로 풀린다.

<div id="labelLayer"></div>

<div id="nameGate" hidden>

    <label for="nicknameInput">닉네임을 입력하세요</label>

<script type="module">
import * as THREE from 'three';
import { createMesh } from './lib/webrtc-mesh.js';

/* ============================================================
   3단계 — docs/PLAN.md 8번. 같은 브라우저 2탭(또는 다른 기기)을 PeerJS로
   연결해서 위치/상태 동기화 + 보간이 실제로 부드러운지 확인한다.

   상태 동기화 설계는 docs/PLAN.md 4번 그대로:
   - 위치/회전: 초당 ~10회, 받는 쪽은 마지막 두 스냅샷을 보간(lerp)해서 그린다.
   - 상태 이름(Idle/Walk): 바뀔 때만 보낸다.
   지금은 프로토타입이라 한 DataConnection(기본 reliable 채널)에 둘 다
   실어 보낸다 — "unreliable 채널로 더 가볍게"는 나중 최적화 대상.
   ============================================================ */

/* ---- 닉네임 입장 게이트(docs/PLAN.md 6-a) ----
   서버 저장 없이 localStorage에만 남긴다 — 인증이 아니라 "화면에 이름
   표시"가 목적이라 이 정도로 충분하다는 결론. */
const NICKNAME_STORAGE_KEY = 'hangout-lounge:nickname';
function loadSavedNickname(){
  try { return localStorage.getItem(NICKNAME_STORAGE_KEY) || ''; }
  catch { return ''; } // 프라이빗 모드 등에서 localStorage가 막혀있을 수 있음
}
function saveNickname(name){
  try { localStorage.setItem(NICKNAME_STORAGE_KEY, name); } catch {}
}

function promptNickname(defaultValue){
  return new Promise((resolve)=>{
    const gate = document.getElementById('nameGate');
    const input = document.getElementById('nicknameInput');
    const btn = document.getElementById('nicknameSubmit');
    input.value = defaultValue || '';
    gate.hidden = false;
    input.focus();
    function submit(){
      const name = input.value.trim().slice(0,16) || '손님';
      btn.removeEventListener('click', submit);
      input.removeEventListener('keydown', onKey);
      gate.hidden = true;
      saveNickname(name);
      resolve(name);
    }
    function onKey(e){ if(e.key==='Enter') submit(); }
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', onKey);
  });
}

async function getNickname(){
  const saved = loadSavedNickname();
  if(saved) return saved;
  return promptNickname('');
}

/* ---- 외형 커스터마이징 저장 ----
   닉네임과 같은 이유로 서버 없이 localStorage에만 남긴다. DEFAULT_APPEARANCE는
   아래(HAMSTER_PALETTE 근처)에서 정의되지만, 이 함수들은 main() 시작 이후에나
   실제로 호출되므로 그때는 이미 다 정의돼 있다. */
const APPEARANCE_STORAGE_KEY = 'hangout-lounge:appearance';
function loadSavedAppearance(){
  try {
    const raw = localStorage.getItem(APPEARANCE_STORAGE_KEY);
    if(!raw) return { ...DEFAULT_APPEARANCE };
    return { ...DEFAULT_APPEARANCE, ...JSON.parse(raw) };
  } catch { return { ...DEFAULT_APPEARANCE }; }
}
function saveAppearance(appearance){
  try { localStorage.setItem(APPEARANCE_STORAGE_KEY, JSON.stringify(appearance)); } catch {}
}

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1e);
scene.fog = new THREE.Fog(0x1a1a1e, 15, 55); // 맵이 커져서 원래(10,30)보다 멀리 보이게

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 120);

const hemi = new THREE.HemisphereLight(0xffffff, 0x333333, 1.2);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(3, 6, 4);
scene.add(key);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(24, 48),
  new THREE.MeshStandardMaterial({color:0x2a2a30, roughness:0.9})
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

/* ---- 벤치(카페/공원 어느 쪽이든 쓸 수 있는 범용 좌석 소품) ----
   나무 판(좌석+등받이) + 다리 4개, 전부 박스 지오메트리. 팔레트는 햄스터와
   겹치지 않는 나무/금속 톤 몇 가지로 고정(ART_STYLE 1번 — 색 즉석 생성 금지).
   기본 2인용 — group.userData.seatOffsets(길이 2)/seatYaw로 "앉았을 때
   아바타가 있어야 할 자리"를 벤치 로컬 좌표로 따로 들고 있어서, 벤치를 씬
   어디에 놓고 돌려도 앉기 좌표 계산이 그대로 맞게 한다.
   userData.collider(halfW/halfD)는 아래 resolveCollisions()가 통과
   막는 용도로 쓰는 벤치 주변 사각 범위(아바타 반경 포함해서 넉넉하게). */
const BENCH_PALETTE = { wood: 0xb98a55, woodDark: 0x8a6239, metal: 0x53585c };

function buildBench(){
  const woodMat  = new THREE.MeshStandardMaterial({color:BENCH_PALETTE.wood, roughness:0.8});
  const metalMat = new THREE.MeshStandardMaterial({color:BENCH_PALETTE.metal, roughness:0.6, metalness:0.3});

  const group = new THREE.Group();

  const seat = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.42), woodMat);
  seat.position.y = 0.42;
  group.add(seat);

  const back = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 0.08), woodMat);
  back.position.set(0, 0.67, -0.17);
  back.rotation.x = -0.15;
  group.add(back);

  const legGeo = new THREE.BoxGeometry(0.08, 0.42, 0.38);
  [-0.52, 0.52].forEach(x=>{
    const leg = new THREE.Mesh(legGeo, metalMat);
    leg.position.set(x, 0.21, 0);
    group.add(leg);
  });

  // 2인용 — 좌석 위, 등받이 반대쪽을 보고 앉게 살짝 앞쪽으로, 왼쪽/오른쪽에
  // 한 자리씩.
  group.userData.seatOffsets = [
    new THREE.Vector3(-0.3, 0.42, 0.1),
    new THREE.Vector3(0.3, 0.42, 0.1),
  ];
  group.userData.seatYaw = 0;
  group.userData.collider = { halfW: 0.68, halfD: 0.42 };

  return group;
}

const benches = [];
function placeBench(x, z, rotY){
  const bench = buildBench();
  bench.position.set(x, 0, z);
  bench.rotation.y = rotY;
  scene.add(bench);
  benches.push(bench);
  return bench;
}

function benchSeatWorld(bench, seatIndex){
  const local = bench.userData.seatOffsets[seatIndex].clone();
  local.applyAxisAngle(new THREE.Vector3(0,1,0), bench.rotation.y);
  return bench.position.clone().add(local);
}
function benchSeatYaw(bench){
  return bench.rotation.y + bench.userData.seatYaw;
}

/* ---- 소품 콜리전(벤치/나무/테이블을 그냥 통과해서 걸어다니던 문제) ----
   물리엔진 없이, 소품을 로컬 좌표계의 사각형(userData.collider)으로 보고 그
   안에 들어오면 가장 얕게 파고든 축으로 밀어내는 정도의 단순한 처리. 이
   프로젝트는 "정밀 물리 동기화 안 함"이 원칙(docs/PLAN.md 1번)이라 이 정도
   관대함이면 충분하다 — 내 아바타에만 적용하고(각자 클라이언트가 자기
   위치를 이렇게 보정), 남의 아바타는 보정된 위치가 그대로 네트워크로
   전달되니 손 안 대도 됨. colliders 배열은 아래에서 벤치/나무/카페 소품을
   다 만든 뒤 한 번에 채운다. */
const AVATAR_RADIUS = 0.28;
const colliders = [];
function resolveCollisions(pos){
  for(const obj of colliders){
    const { halfW, halfD } = obj.userData.collider;
    const local = pos.clone().sub(obj.position);
    local.applyAxisAngle(new THREE.Vector3(0,1,0), -obj.rotation.y);
    const w = halfW + AVATAR_RADIUS, d = halfD + AVATAR_RADIUS;
    if(Math.abs(local.x) < w && Math.abs(local.z) < d){
      const penX = w - Math.abs(local.x);
      const penZ = d - Math.abs(local.z);
      if(penX < penZ) local.x = Math.sign(local.x || 1) * w;
      else local.z = Math.sign(local.z || 1) * d;
      local.applyAxisAngle(new THREE.Vector3(0,1,0), obj.rotation.y);
      pos.copy(obj.position).add(local);
    }
  }
  return pos;
}

/* ---- 큰 맵: 공원 존 + 카페 존을 한 맵 안에 ----
   요청("전부 있는 큰 맵")대로 둘 중 하나를 고르지 않고 이어붙였다 — 왼쪽은
   공원(잔디 바닥 + 나무 + 벤치), 오른쪽은 카페(실내 톤 바닥 + 테이블/스툴),

function addGroundPatch(x, z, radius, color){
  const patch = new THREE.Mesh(
    new THREE.CircleGeometry(radius, 32),
    new THREE.MeshStandardMaterial({color, roughness:0.9})
  );
  patch.rotation.x = -Math.PI/2;
  patch.position.set(x, 0.01, z); // 베이스 바닥보다 살짝 띄워서 겹침(z-fighting) 방지
  scene.add(patch);
}

function buildTree(){

  );

  group.add(trunk);
  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(0.75, 10, 8),

  leaves.scale.set(1, 0.9, 1);
  group.add(leaves);
  group.userData.collider = { halfW:0.35, halfD:0.35 };

}
const trees = [];

const cafeProps = []; // 테이블/스툴 — 장식+콜리전만, 앉기 기능은 벤치만 지원(스코프 상)

/* ---- 아바타: 귀여운 햄스터(프리미티브 조립) ----
   외부 에셋/저장소에 의존하지 않기 위해 glTF 로드 대신 Three.js 기본
   도형만 조합해서 만든다. 팔레트는 ART_STYLE 규칙대로 고정 색만 쓴다
   (CLAUDE.md "아트 스타일" 1번). */
const HAMSTER_PALETTE = {
  bodyLight: 0xf3d9b1,
  bodyShade: 0xe0b98a,
  belly:     0xfbeed7,
  cheek:     0xf4a6a6,
  eye:       0x2a1f1a,
  nose:      0x5a3a2a,
  cigarette:    0xf0ede4,
  cigaretteTip: 0xe8703a,
};

/* ---- 커스터마이징 팔레트 ----
   몸통 색은 "기본색 하나만 고르면 진한 톤/밝은 톤을 정해진 계산식으로
   자동 유도"하는 방식이다(ART_STYLE 1번 "즉석에서 색 생성 금지"의 취지는
   "일관성 없이 아무 색이나 막 늘어나는 것"을 막자는 것이라, 여기서는 고정된
   6가지 기본색 + 정해진 유도 공식(HSL 밝기만 ±) 하나로 제한해서 그 취지를
   지킨다 — 색상 자체가 무한정 늘어나진 않는다). */
const BODY_COLOR_OPTIONS = [0xf3d9b1, 0xa9784c, 0xf5f0e6, 0xb8b0a8, 0xf0c4c4, 0x9fb0b8];
const HAIR_COLOR_OPTIONS = [0x6b4a34, 0x2a1f1a, 0xe0b8d8, 0xd8c840];

function deriveBodyShades(baseHex){
  const base = new THREE.Color(baseHex);
  const shade = base.clone().offsetHSL(0, 0, -0.14);
  const belly = base.clone().offsetHSL(0, 0, 0.16);
  return { body: base, shade, belly };
}

const DEFAULT_APPEARANCE = {
  bodyColorIdx: 0,
  eyeStyle: 0,   // 0=동그란 눈, 1=웃는 눈(아치), 2=반짝이는 눈
  mouthStyle: 0, // 0=없음, 1=냥이 입(:3), 2=벌린 웃음
  hairStyle: 0,  // 0=없음, 1=삐침머리, 2=리본
  hairColorIdx: 0,
};

function buildHamster(appearance){
  const shades = deriveBodyShades(BODY_COLOR_OPTIONS[appearance.bodyColorIdx]);
  const bodyMat  = new THREE.MeshStandardMaterial({color:shades.body,  roughness:0.85});
  const bellyMat = new THREE.MeshStandardMaterial({color:shades.belly, roughness:0.85});
  const shadeMat = new THREE.MeshStandardMaterial({color:shades.shade, roughness:0.85});
  const cheekMat = new THREE.MeshStandardMaterial({color:HAMSTER_PALETTE.cheek,     roughness:0.9});
  const eyeMat   = new THREE.MeshStandardMaterial({color:HAMSTER_PALETTE.eye,       roughness:0.4});
  const noseMat  = new THREE.MeshStandardMaterial({color:HAMSTER_PALETTE.nose,      roughness:0.6});
  const hairMat  = new THREE.MeshStandardMaterial({color:HAIR_COLOR_OPTIONS[appearance.hairColorIdx], roughness:0.7});

  const root = new THREE.Group();
  const bouncePivot = new THREE.Group();
  root.add(bouncePivot);

  // 몸통(살짝 눌린 구)
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.32, 20, 16), bodyMat);
  body.scale.set(1, 0.85, 1.1);
  body.position.y = 0.34;
  bouncePivot.add(body);

  // 배(밝은 포인트 컬러)
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 12), bellyMat);
  belly.scale.set(0.9, 0.75, 0.7);
  belly.position.set(0, 0.28, 0.14);
  bouncePivot.add(belly);

  // 머리(치비 비율 — 몸보다 크게)
  const headPivot = new THREE.Group();
  headPivot.position.set(0, 0.62, 0.06);
  bouncePivot.add(headPivot);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 20, 16), bodyMat);
  headPivot.add(head);

  // 볼(햄스터 뺨 주머니)
  const cheekGeo = new THREE.SphereGeometry(0.12, 12, 10);
  const cheekL = new THREE.Mesh(cheekGeo, cheekMat);
  cheekL.position.set(-0.22, -0.04, 0.14);
  cheekL.scale.set(1, 0.85, 0.9);
  headPivot.add(cheekL);
  const cheekR = cheekL.clone();
  cheekR.position.x = 0.22;
  headPivot.add(cheekR);

  // 귀
  const earGeo = new THREE.SphereGeometry(0.1, 12, 10);
  const earL = new THREE.Mesh(earGeo, shadeMat);
  earL.position.set(-0.17, 0.24, -0.02);
  earL.scale.set(1, 1, 0.5);
  headPivot.add(earL);
  const earR = earL.clone();
  earR.position.x = 0.17;
  headPivot.add(earR);

  // 눈(스타일 3종 — 전부 만들어두고 고른 것만 보이게 토글)
  function mirrorPair(mesh, x){
    const l = mesh, r = mesh.clone();
    l.position.set(-x, l.position.y, l.position.z);
    r.position.set(x, l.position.y, l.position.z);
    return [l, r];
  }
  const eyeGroups = []; // [스타일0 그룹, 스타일1 그룹, 스타일2 그룹]

  // 0: 동그란 눈(기본)
  const eyesRound = new THREE.Group();
  {
    const eyeGeo = new THREE.SphereGeometry(0.045, 10, 8);
    const [l, r] = mirrorPair(new THREE.Mesh(eyeGeo, eyeMat), 0.1);
    l.position.y = r.position.y = 0.02; l.position.z = r.position.z = 0.27;
    eyesRound.add(l, r);
  }
  headPivot.add(eyesRound);
  eyeGroups.push(eyesRound);

  // 1: 웃는 눈(아치 모양)
  const eyesHappy = new THREE.Group();
  {
    const arcGeo = new THREE.TorusGeometry(0.045, 0.012, 6, 10, Math.PI);
    const [l, r] = mirrorPair(new THREE.Mesh(arcGeo, eyeMat), 0.1);
    [l, r].forEach(m=>{ m.position.y = 0.01; m.position.z = 0.27; m.rotation.z = Math.PI; });
    eyesHappy.add(l, r);
  }
  headPivot.add(eyesHappy);
  eyeGroups.push(eyesHappy);

  // 2: 반짝이는 눈(큰 눈 + 작은 하이라이트)
  const eyesSparkle = new THREE.Group();
  {
    const bigGeo = new THREE.SphereGeometry(0.055, 10, 8);
    const [l, r] = mirrorPair(new THREE.Mesh(bigGeo, eyeMat), 0.1);
    l.position.y = r.position.y = 0.02; l.position.z = r.position.z = 0.27;
    eyesSparkle.add(l, r);
    const hiGeo = new THREE.SphereGeometry(0.018, 8, 6);
    const hiMat = new THREE.MeshBasicMaterial({color:0xffffff});
    const [hl, hr] = mirrorPair(new THREE.Mesh(hiGeo, hiMat), 0.115);
    hl.position.y = hr.position.y = 0.04; hl.position.z = hr.position.z = 0.31;
    eyesSparkle.add(hl, hr);
  }
  headPivot.add(eyesSparkle);
  eyeGroups.push(eyesSparkle);

  // 코
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), noseMat);
  nose.position.set(0, -0.05, 0.3);
  headPivot.add(nose);

  // 입(스타일 3종 — 0번은 "없음"이라 실제 메시가 없다)
  const mouthGroups = [null];
  const mouthCat = new THREE.Group(); // 1: 냥이 입(:3)
  {
    const dotGeo = new THREE.SphereGeometry(0.018, 8, 6);
    const [l, r] = mirrorPair(new THREE.Mesh(dotGeo, noseMat), 0.03);
    l.position.y = r.position.y = -0.09; l.position.z = r.position.z = 0.29;
    mouthCat.add(l, r);
  }
  headPivot.add(mouthCat);
  mouthGroups.push(mouthCat);
  const mouthSmile = new THREE.Group(); // 2: 웃는 입 — 작은 구슬 5개를 살짝
  // 곡선으로 배치해서 웃는 입 모양을 흉내(가장자리가 가운데보다 위로).
  {
    const dotGeo = new THREE.SphereGeometry(0.016, 6, 6);
    const n = 5;
    for(let i=0; i<n; i++){
      const t = i/(n-1) - 0.5; // -0.5 ~ 0.5
      const dot = new THREE.Mesh(dotGeo, noseMat);
      dot.position.set(t*0.11, -0.11 + t*t*0.2, 0.3);
      mouthSmile.add(dot);
    }
  }
  headPivot.add(mouthSmile);
  mouthGroups.push(mouthSmile);

  // 머리 장식(스타일 3종 — 0번은 "없음")
  const hairGroups = [null];
  // 머리 소품은 머리(반지름 0.3 구)의 표면 밖으로 확실히 나오게 배치해야
  // 파묻혀서 안 보인다(눈/코도 이 반지름 살짝 밖에 있는 것과 같은 이유).
  const hairTuft = new THREE.Group(); // 1: 삐침머리
  {
    const tuft = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.18, 8), hairMat);
    tuft.position.set(0.03, 0.34, 0.08);
    tuft.rotation.z = -0.4;
    hairTuft.add(tuft);
  }
  headPivot.add(hairTuft);
  hairGroups.push(hairTuft);
  const hairBow = new THREE.Group(); // 2: 리본(머리 오른쪽 위에)
  {
    const bx = 0.22, by = 0.27, bz = 0.1;
    const knot = new THREE.Mesh(new THREE.SphereGeometry(0.028, 8, 8), hairMat);
    knot.position.set(bx, by, bz);
    hairBow.add(knot);
    const wingGeo = new THREE.ConeGeometry(0.05, 0.08, 4);
    const [wl, wr] = mirrorPair(new THREE.Mesh(wingGeo, hairMat), 0.05);
    wl.position.set(bx - 0.05, by, bz); wr.position.set(bx + 0.05, by, bz);
    wl.rotation.z = Math.PI/2; wr.rotation.z = -Math.PI/2;
    hairBow.add(wl, wr);
  }
  headPivot.add(hairBow);
  hairGroups.push(hairBow);

  // 발(앞/뒤 4개) — sit 포즈에서 원래 자리로 되돌릴 수 있게 시작 좌표를
  // userData에 저장해둔다(뒷발 2개는 앉을 때 몸 아래로 당겨야 해서 필요).
  const footGeo = new THREE.SphereGeometry(0.09, 12, 10);
  const feet = [[-0.16,-0.14],[0.16,-0.14],[-0.14,0.12],[0.14,0.12]].map(([x,z])=>{
    const f = new THREE.Mesh(footGeo, shadeMat);
    f.position.set(x, 0.09, z);
    f.scale.set(1, 0.7, 1);
    f.userData.baseX = x;
    f.userData.baseZ = z;
    bouncePivot.add(f);
    return f;
  });

  // 꼬리(짧고 동글)
  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), shadeMat);
  tail.position.set(0, 0.3, -0.38);
  bouncePivot.add(tail);

  // 담배(입 옆에 물린 자리 — 팔이 없는 프리미티브 아바타라 "손으로 든다"
  // 대신 입가에 붙여둔 걸로 대신한다). Smoke 상태일 때만 보이게.
  const cigarette = new THREE.Group();
  const cigBody = new THREE.Mesh(
    new THREE.CylinderGeometry(0.012, 0.012, 0.16, 6),
    new THREE.MeshStandardMaterial({color:HAMSTER_PALETTE.cigarette, roughness:0.7})
  );
  cigBody.rotation.z = Math.PI/2;
  cigarette.add(cigBody);
  const cigTip = new THREE.Mesh(
    new THREE.SphereGeometry(0.014, 8, 8),
    new THREE.MeshBasicMaterial({color:HAMSTER_PALETTE.cigaretteTip})
  );
  cigTip.position.x = 0.09;
  cigarette.add(cigTip);
  cigarette.position.set(0.14, -0.04, 0.26);
  cigarette.rotation.y = -0.3;
  cigarette.visible = false;
  headPivot.add(cigarette);

  // 감정표현용 팔(오른쪽 — 손 흔들기/박수/뻐큐가 이 팔 하나를 재사용하고
  // 포즈(피벗 회전)와 손가락 표시 여부만 다르게 준다). 평소엔 숨김.
  const armPivot = new THREE.Group();
  armPivot.position.set(0.34, 0.5, 0.12);
  armPivot.visible = false;
  bouncePivot.add(armPivot);
  const upperArm = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.055, 0.2, 4, 8),
    bodyMat
  );
  upperArm.rotation.z = Math.PI/2;
  upperArm.position.x = 0.13;
  armPivot.add(upperArm);
  const fist = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 8), bodyMat);
  fist.position.x = 0.27;
  armPivot.add(fist);
  const finger = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.022, 0.13, 4, 6),
    bodyMat
  );
  finger.position.set(0.27, 0.1, 0);
  finger.visible = false;
  armPivot.add(finger);

  // 하트(이모트용) — 머리 위에 작은 구 두 개 + 아래쪽을 뾰족하게 마감해서
  // 하트 실루엣만 흉내. headPivot이 아니라 bouncePivot에 둬서 고개 숙임
  // 애니메이션에 안 딸려가게 한다.
  const heartGroup = new THREE.Group();
  heartGroup.position.set(0, 1.05, 0.1);
  heartGroup.visible = false;
  const heartMat = new THREE.MeshStandardMaterial({color:HAMSTER_PALETTE.cheek, roughness:0.5});
  const heartL = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), heartMat);
  heartL.position.set(-0.05, 0, 0);
  heartGroup.add(heartL);
  const heartR = heartL.clone();
  heartR.position.x = 0.05;
  heartGroup.add(heartR);
  const heartBottom = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.14, 4), heartMat);
  heartBottom.rotation.x = Math.PI;
  heartBottom.rotation.y = Math.PI/4;
  heartBottom.position.set(0, -0.08, 0);
  heartGroup.add(heartBottom);
  bouncePivot.add(heartGroup);

  return {
    root, bouncePivot, headPivot, earL, earR, feet,
    cigarette, cigaretteTipLocal: cigTip,
    armPivot, finger, heartGroup,
    bodyMat, shadeMat, bellyMat, hairMat,
    eyeGroups, mouthGroups, hairGroups,
  };
}

/** 외형(몸통색/눈/입/머리 장식)을 이미 만들어진 아바타 파츠에 적용한다.
 *  buildHamster()가 처음 만들 때도, 나중에 설정을 바꿀 때도 이 함수 하나로
 *  처리한다 — 지오메트리를 다시 만들지 않고 색만 바꾸거나(body/shade/belly/
 *  hairMat) 미리 만들어둔 스타일 그룹 중 하나만 보이게 토글한다. */
function applyAppearance(parts, appearance){
  const shades = deriveBodyShades(BODY_COLOR_OPTIONS[appearance.bodyColorIdx]);
  parts.bodyMat.color.copy(shades.body);
  parts.shadeMat.color.copy(shades.shade);
  parts.bellyMat.color.copy(shades.belly);
  parts.hairMat.color.setHex(HAIR_COLOR_OPTIONS[appearance.hairColorIdx]);
  parts.eyeGroups.forEach((g, i)=>{ g.visible = i === appearance.eyeStyle; });
  parts.mouthGroups.forEach((g, i)=>{ if(g) g.visible = i === appearance.mouthStyle; });
  parts.hairGroups.forEach((g, i)=>{ if(g) g.visible = i === appearance.hairStyle; });
}

/* 애니메이션 클립이 없으니 THREE.AnimationMixer 대신 상태(state)에 따라
   매 프레임 파츠를 직접 흔드는 가벼운 "가짜 mixer"를 쓴다. 호출부
   (spawnAvatar 사용처)는 이전과 동일하게 {model, mixer, playState}만
   보고 쓰므로 위쪽 로직은 손댈 필요가 없다. Idle/Walk에 이어 Sit도 여기서
   포즈만 만든다 — 뼈대가 없어서 "진짜로 벤치에 걸터앉는" 자세는 아니고,
   몸통을 낮추고 뒷발을 몸 아래로 당겨서 앉은 느낌만 낸다. */
const SIT_DROP = 0.1; // 앉을 때 몸통이 내려앉는 높이

async function spawnAvatar(appearance){
  const parts = buildHamster(appearance || DEFAULT_APPEARANCE);
  applyAppearance(parts, appearance || DEFAULT_APPEARANCE);
  scene.add(parts.root);

  let state = 'Idle';
  let t = 0;
  let stateStartT = 0; // Jump/Wave/Clap처럼 "상태로 바뀐 순간부터"의 위상이 필요한 포즈용

  /* ---- 담배 연기 파티클 ----
   * 아바타별로 자기 담배 끝(cigaretteTipLocal)에서 주기적으로 작고 옅은
   * 구체를 하나씩 만들어서 위로 흘려보내며 커지고 옅어지다 지운다 —
   * 별도 파티클 시스템 라이브러리 없이 메시 풀만으로 충분한 수준(1인당
   * 최대 몇 개뿐이라 12명이 다 피워도 가벼움). */
  const smokeParticles = [];
  let smokeEmitAcc = 0;
  const smokeWorldPos = new THREE.Vector3();

  const mixer = {
    update(dt){
      t += dt;
      const localT = t - stateStartT; // 이 상태가 시작된 뒤로 지난 시간
      const walking = state === 'Walk';
      const sitting = state === 'Sit';
      const smoking = state === 'Smoke';
      const jumping = state === 'Jump';
      const waving  = state === 'Wave';
      const clapping = state === 'Clap';
      const flippingOff = state === 'FlipOff';
      const heartingE = state === 'Heart';
      const armEmote = waving || clapping || flippingOff;

      const freq = walking ? 9 : (sitting ? 1.4 : 2.2);
      const amp  = walking ? 0.05 : (sitting ? 0.01 : (jumping ? 0 : 0.02));
      const jumpHeight = jumping ? Math.sin(Math.min(localT/0.45, 1) * Math.PI) * 0.35 : 0;
      const baseY = sitting ? -SIT_DROP : jumpHeight;
      parts.bouncePivot.position.y = baseY + Math.abs(Math.sin(t*freq)) * amp;
      const earWiggle = Math.sin(t*(walking?14:3)) * (walking?0.12:0.05);
      parts.earL.rotation.z =  earWiggle;
      parts.earR.rotation.z = -earWiggle;
      parts.headPivot.rotation.z = Math.sin(t*(walking?9:1.6)) * (walking?0.04:0.03);
      // 앉으면 살짝 고개 숙이고, 담배 물면 살짝 기울인다.
      parts.headPivot.rotation.x = sitting ? 0.12 : (smoking ? 0.05 : 0);

      // 감정표현: 팔(손흔들기/박수/뻐큐 공용) + 하트(머리 위에 둥실).
      parts.armPivot.visible = armEmote;
      parts.finger.visible = flippingOff;
      if(waving){
        parts.armPivot.rotation.z = 1.15 + Math.sin(localT*10)*0.3; // 옆으로 들고 흔듦(머리에 안 가리게)
        parts.armPivot.position.x = 0.34;
      } else if(clapping){
        parts.armPivot.rotation.z = 0.9;
        parts.armPivot.position.x = 0.34 - Math.abs(Math.sin(localT*14))*0.1; // 몸 쪽으로 모았다 폈다
      } else if(flippingOff){
        parts.armPivot.rotation.z = 1.2;
        parts.armPivot.position.x = 0.34;
      }
      parts.heartGroup.visible = heartingE;
      if(heartingE){
        parts.heartGroup.scale.setScalar(1 + Math.sin(localT*6)*0.15);
        parts.heartGroup.position.y = 1.05 + Math.sin(localT*3)*0.03;
      }

      parts.cigarette.visible = smoking;
      if(smoking){
        smokeEmitAcc += dt;
        if(smokeEmitAcc > 0.5){
          smokeEmitAcc = 0;
          parts.cigaretteTipLocal.getWorldPosition(smokeWorldPos);
          const p = new THREE.Mesh(
            new THREE.SphereGeometry(0.02, 6, 6),
            new THREE.MeshBasicMaterial({color:0xdddddd, transparent:true, opacity:0.5})
          );
          p.position.copy(smokeWorldPos);
          scene.add(p);
          smokeParticles.push({mesh:p, age:0, life:1.6});
        }
      }
      for(let i=smokeParticles.length-1; i>=0; i--){
        const sp = smokeParticles[i];
        sp.age += dt;
        const t01 = sp.age/sp.life;
        if(t01 >= 1){
          scene.remove(sp.mesh);
          sp.mesh.geometry.dispose();
          sp.mesh.material.dispose();
          smokeParticles.splice(i,1);
          continue;
        }
        sp.mesh.position.y += dt*0.35;
        sp.mesh.position.x += Math.sin(sp.age*3)*dt*0.05;
        sp.mesh.scale.setScalar(1 + t01*2.5);
        sp.mesh.material.opacity = 0.5*(1-t01);
      }

      parts.feet.forEach((f,i)=>{
        const isBack = i>=2;
        if(sitting){
          // 뒷발은 몸 아래로 당기고, 앞발은 그대로 짚은 자세
          f.position.x = f.userData.baseX;
          f.position.z = isBack ? f.userData.baseZ - 0.1 : f.userData.baseZ;
          f.position.y = isBack ? 0.03 : 0.09;
        } else {
          const phase = (i%2===0) ? 0 : Math.PI;
          f.position.x = f.userData.baseX;
          f.position.z = f.userData.baseZ;
          f.position.y = walking ? 0.09 + Math.max(0, Math.sin(t*freq*2+phase))*0.05 : 0.09;
        }
      });
    },
  };
  function playState(name){
    if(name === state) return;
    state = name;
    stateStartT = t;
  }
  function updateAppearance(appearance){ applyAppearance(parts, appearance); }
  return { model: parts.root, mixer, playState, updateAppearance };
}

/* 여기부터 async main() 안에서 실행한다 — 예전에 다른 게임(붕어빵 카페)에서
   최상위(top-level) await 가 실패(GLB 404 등)했을 때 그 뒤의 모든 코드가
   조용히 실행 안 되는 버그를 실제로 겪었다(이벤트 리스너 등록까지 전부
   증발 — "시작 버튼이 안 눌린다"는 신고로 발견). try/catch 로 감싸서 같은
   사고가 재발하지 않게 한다. */
async function main(myNickname){

/* ---- 아바타 머리 위 닉네임 라벨 ----
   CSS2DRenderer 같은 별도 three.js 애드온을 안 쓰고, 3D 좌표를 화면
   좌표로 직접 projection해서 평범한 절대 위치 div를 그 자리에 둔다. */
const labelLayerEl = document.getElementById('labelLayer');
function createNameLabel(text){
  const el = document.createElement('div');
  el.className = 'nameLabel';
  el.textContent = text;
  labelLayerEl.appendChild(el);
  return el;
}
const labelProjectVec = new THREE.Vector3();
function updateLabelPosition(labelEl, model){
  labelProjectVec.set(model.position.x, model.position.y+1.05, model.position.z);
  labelProjectVec.project(camera);
  if(labelProjectVec.z > 1){ labelEl.style.display = 'none'; return; }
  labelEl.style.display = '';
  const x = (labelProjectVec.x*0.5+0.5) * innerWidth;
  const y = (1-(labelProjectVec.y*0.5+0.5)) * innerHeight;
  labelEl.style.transform = `translate(-50%,-100%) translate(${x}px,${y}px)`;
}

/* ---- 내 아바타 + WASD 이동 ---- */
let myAppearance = loadSavedAppearance();
const me = await spawnAvatar(myAppearance);
me.nameLabelEl = createNameLabel(myNickname);

/* ---- 외형 커스터마이징 UI ----
   몸통 색/머리 장식 색은 BODY_COLOR_OPTIONS/HAIR_COLOR_OPTIONS 배열로부터
   스와치 버튼을 그때그때 만들고, 눈/입/머리 장식 모양은 이미 HTML에 있는
   버튼 3개짜리 행을 그대로 쓴다. 바뀔 때마다 저장 + 내 아바타에 바로
   반영 + 방에 있는 사람들에게 브로드캐스트까지 한 함수(applyAppearanceChange)
   에서 처리한다. */
function buildColorSwatches(containerId, options, cat){
  const row = document.getElementById(containerId);
  options.forEach((hex, i)=>{
    const btn = document.createElement('button');
    btn.className = 'colorSwatch';
    btn.style.background = '#' + hex.toString(16).padStart(6,'0');
    btn.dataset.cat = cat;
    btn.dataset.val = i;
    row.appendChild(btn);
  });
}
buildColorSwatches('bodyColorRow', BODY_COLOR_OPTIONS, 'bodyColorIdx');
buildColorSwatches('hairColorRow', HAIR_COLOR_OPTIONS, 'hairColorIdx');

function refreshAppearanceUI(){
  document.querySelectorAll('#appearancePanel [data-cat]').forEach(btn=>{
    const cat = btn.dataset.cat;
    const val = Number(btn.dataset.val);
    btn.classList.toggle('selected', myAppearance[cat] === val);
  });
}
function applyAppearanceChange(cat, val){
  myAppearance = { ...myAppearance, [cat]: val };
  saveAppearance(myAppearance);
  me.updateAppearance(myAppearance);
  refreshAppearanceUI();
  mesh.broadcast({type:'appearance', appearance: myAppearance});
}
document.getElementById('appearancePanel').addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-cat]');
  if(!btn) return;
  applyAppearanceChange(btn.dataset.cat, Number(btn.dataset.val));
});
refreshAppearanceUI();

const keys = {KeyW:false,KeyA:false,KeyS:false,KeyD:false};
addEventListener('keydown', e=>{ if(e.code in keys) keys[e.code]=true; });
addEventListener('keyup',   e=>{ if(e.code in keys) keys[e.code]=false; });

/* ---- 모바일 이동 스틱(왼쪽 아래) ----
   터치 기기에서만 보이게 하고(PC는 WASD), 값은 keys와 같은 좌표계
   (x: 좌우, y: 전후, 각각 -1~1)라 아래 updateMyAvatar에서 키보드 입력과
   그냥 더하기만 하면 된다 — 둘 다 동시에 써도 안 꼬임. 카메라 시야는
   스틱을 따로 두지 않고, 아래 updateCamera 쪽의 "화면 드래그" 로직을
   그대로 쓴다(Pointer Events라 마우스든 터치든 같은 코드 — PC와 모바일
   둘 다 이동 스틱/버튼이 없는 빈 화면을 드래그하면 카메라가 돈다). */
const joyVec = {x:0, y:0};
const isTouchDevice = matchMedia('(pointer:coarse)').matches || navigator.maxTouchPoints > 0;
if(isTouchDevice){
  const joystickEl = document.getElementById('joystick');
  const joystickKnob = document.getElementById('joystickKnob');
  joystickEl.hidden = false;
  const R = 40; // knob이 움직일 수 있는 최대 반경(px)
  let activeId = null;
  function setKnob(dx, dy){ joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`; }
  function resetJoystick(){ joyVec.x = 0; joyVec.y = 0; setKnob(0,0); activeId = null; }
  joystickEl.addEventListener('pointerdown', e=>{
    activeId = e.pointerId;
    joystickEl.setPointerCapture(activeId);
  });
  joystickEl.addEventListener('pointermove', e=>{
    if(e.pointerId !== activeId) return;
    const rect = joystickEl.getBoundingClientRect();
    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const len = Math.hypot(dx, dy);
    if(len > R){ dx = dx/len*R; dy = dy/len*R; }
    setKnob(dx, dy);
    joyVec.x = dx / R;
    joyVec.y = dy / R;
  });
  joystickEl.addEventListener('pointerup', e=>{ if(e.pointerId===activeId) resetJoystick(); });
  joystickEl.addEventListener('pointercancel', e=>{ if(e.pointerId===activeId) resetJoystick(); });
}

const moveDir = new THREE.Vector3();
let myState = 'Idle';
// null | 'Sit' | 'Smoke' — 둘 다 "이동 입력 들어오면 자동으로 풀리는" 같은
// 규칙을 쓰는 제자리 상태라 하나로 묶는다(네트워크로는 여전히 myState
// 문자열 하나만 보낸다 — docs/PLAN.md 4번, 한 번에 한 상태만).
let specialState = null;

function endSpecialState(){
  if(!specialState) return;
  specialState = null;
  myState = 'Idle';
  me.playState('Idle');
  netSendStateSoon();
  document.getElementById('smokeBtn').classList.remove('active');
}

// 벤치까지 걸어가서 앉는 짧은 전환 애니메이션(아래 sitOnBench가 채움) —
// 텔레포트 대신 실제 걷는 속도로 부드럽게 이동한 다음 앉는다.
let sitAnim = null; // {fromPos, toPos, toYaw, t, duration}

function updateMyAvatar(dt){
  if(sitAnim){
    sitAnim.t += dt;
    const p = Math.min(1, sitAnim.t / sitAnim.duration);
    me.model.position.lerpVectors(sitAnim.fromPos, sitAnim.toPos, p);
    if(p < 1){
      const dir = sitAnim.toPos.clone().sub(sitAnim.fromPos);
      if(dir.lengthSq() > 0.0001) me.model.rotation.y = Math.atan2(dir.x, dir.z);
    } else {
      me.model.rotation.y = sitAnim.toYaw;
      sitAnim = null;
      myState = 'Sit';
      me.playState('Sit');
      netSendStateSoon();
    }
    return;
  }

  moveDir.set(
    (keys.KeyD?1:0)-(keys.KeyA?1:0) + joyVec.x,
    0,
    (keys.KeyS?1:0)-(keys.KeyW?1:0) + joyVec.y
  );
  const moving = moveDir.lengthSq()>0.01;
  if(specialState){
    if(moving) endSpecialState(); // 이동 입력이 들어오면 자동으로 풀림
    else return; // 앉아있거나 담배 피우는 동안은 위치를 그대로 고정
  }
  if(moving){
    moveDir.normalize();
    const candidate = me.model.position.clone().addScaledVector(moveDir, dt*2.2);
    resolveCollisions(candidate);
    me.model.position.copy(candidate);
    me.model.rotation.y = Math.atan2(moveDir.x, moveDir.z);
  }
  const nextState = moving ? 'Walk' : 'Idle';
  if(nextState!==myState){ myState=nextState; me.playState(myState); netSendStateSoon(); }
}

/* ---- 벤치 클릭/탭으로 앉기(2인용, 좌/우 자리 각각 점유 판정) ----
   조이스틱은 #joystick 전용 엘리먼트에서만 포인터를 가로채므로 캔버스
   click과 안 꼬인다. 다시 이동하면 일어난다. */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const SEAT_OCCUPIED_DIST = 0.25;

function isSeatOccupied(seatWorldPos){
  if(!sitAnim && myState==='Sit' && me.model.position.distanceTo(seatWorldPos) < SEAT_OCCUPIED_DIST) return true;
  for(const av of remoteAvatars.values()){
    if(av.currentState==='Sit' && av.model.position.distanceTo(seatWorldPos) < SEAT_OCCUPIED_DIST) return true;
  }
  return false;
}

const MAX_SIT_TRIGGER_DIST = 2.2; // 이 거리보다 멀면 클릭해도 무시(먼 벤치로 끌려가는 게 어색해서)

function sitOnBench(bench, preferredSeat){
  const order = preferredSeat===1 ? [1,0] : [0,1];
  let seatIndex = null;
  for(const idx of order){
    if(!isSeatOccupied(benchSeatWorld(bench, idx))){ seatIndex = idx; break; }
  }
  if(seatIndex===null) return; // 둘 다 차있음 — 그냥 무시
  if(me.model.position.distanceTo(benchSeatWorld(bench, seatIndex)) > MAX_SIT_TRIGGER_DIST) return; // 너무 멀면 무시

  sitAnim = {
    fromPos: me.model.position.clone(),
    toPos: benchSeatWorld(bench, seatIndex),
    toYaw: benchSeatYaw(bench),
    t: 0,
    duration: Math.max(0.2, me.model.position.distanceTo(benchSeatWorld(bench, seatIndex)) / 2.2),
  };
  specialState = 'Sit';
  myState = 'Walk'; // 걸어가는 동안은 Walk 포즈로 보이게
  me.playState('Walk');
  netSendStateSoon();
  document.getElementById('smokeBtn').classList.remove('active'); // 담배 피우다 앉은 경우 버튼 표시 초기화
}
renderer.domElement.addEventListener('click', (e)=>{
  if(dragMoved > 6) return; // 시야를 드래그하느라 움직인 클릭이면 앉기 판정 안 함
  pointerNDC.x = (e.clientX/innerWidth)*2 - 1;
  pointerNDC.y = -(e.clientY/innerHeight)*2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(benches, true);
  if(!hits.length) return;
  let obj = hits[0].object;
  while(obj.parent && !benches.includes(obj)) obj = obj.parent;
  if(!benches.includes(obj)) return;
  const localHit = hits[0].point.clone().sub(obj.position);
  localHit.applyAxisAngle(new THREE.Vector3(0,1,0), -obj.rotation.y);
  sitOnBench(obj, localHit.x < 0 ? 0 : 1);
});

/* ---- 담배 버튼(제자리 토글) ----
   벤치처럼 씬 안의 오브젝트를 클릭하는 게 아니라 어디서든 바로 피울 수
   있는 개인 액션이라 UI 버튼(+ 키보드 F)으로 토글한다. */
const smokeBtnEl = document.getElementById('smokeBtn');
function toggleSmoke(){
  if(specialState === 'Smoke'){ endSpecialState(); return; }
  specialState = 'Smoke';
  myState = 'Smoke';
  me.playState('Smoke');
  netSendStateSoon();
  smokeBtnEl.classList.add('active');
}
smokeBtnEl.addEventListener('click', toggleSmoke);
addEventListener('keydown', e=>{ if(e.code === 'KeyF') toggleSmoke(); });

/* ---- 감정표현 메뉴 ----
   버튼(또는 E키)으로 목록을 열고 그중 하나를 고르면 잠깐 재생 후 자동으로
   Idle로 돌아간다(벤치/담배처럼 "다시 움직이면 풀림"이 아니라 정해진
   길이만큼만 — 짧은 동작이라 그게 더 자연스럽다). 앉아있는 동안은 다음
   라운드 과제(아바타 위치가 좌석 높이로 올라가 있어서 서 있는 포즈를
   겹치면 붕 뜨는 문제가 있음) — 지금은 무시하고, 담배는 피우던 중이면
   자동으로 끄고 이모트로 넘어간다. */
const emoteBtnEl = document.getElementById('emoteBtn');
const emoteMenuEl = document.getElementById('emoteMenu');
const EMOTE_DURATION = { Wave:1.8, Clap:1.8, Jump:0.9, Heart:1.8, FlipOff:1.8 };
let emoteTimer = null;

function playEmote(name){
  emoteMenuEl.hidden = true;
  if(sitAnim || specialState === 'Sit') return;
  if(specialState === 'Smoke') endSpecialState();
  clearTimeout(emoteTimer);
  // specialState로 등록해야 updateMyAvatar의 "안 움직이면 Idle" 로직이
  // 매 프레임 덮어쓰지 않는다(Sit/Smoke와 같은 매커니즘 재사용) — 움직이면
  // endSpecialState가 자동으로 풀어주는 것도 그대로 적용된다.
  specialState = name;
  myState = name;
  me.playState(name);
  netSendStateSoon();
  emoteTimer = setTimeout(()=>{
    if(specialState !== name) return; // 그 사이 이동 등으로 이미 풀렸으면 손대지 않음
    endSpecialState();
  }, (EMOTE_DURATION[name] || 1.5) * 1000);
}
emoteBtnEl.addEventListener('click', ()=>{ emoteMenuEl.hidden = !emoteMenuEl.hidden; });
emoteMenuEl.querySelectorAll('button[data-emote]').forEach(btn=>{
  btn.addEventListener('click', ()=> playEmote(btn.dataset.emote));
});
addEventListener('keydown', e=>{ if(e.code === 'KeyE') emoteMenuEl.hidden = !emoteMenuEl.hidden; });

/* ---- 카메라: 아바타를 중심으로 공전(orbit) ----
   기존엔 고정 오프셋(뒤에서 살짝 위)이었는데, 화면(캔버스)을 드래그하면
   카메라가 도는 방식으로 바꿨다 — 마우스든 터치든 Pointer Events라 같은
   코드로 처리된다(별도 시야 스틱 없이 이동 스틱이 없는 빈 화면 아무 데나
   드래그하면 된다). FPS류 포인터락이 아니라 "누르고 끄는 동안만" 도는
   방식(사용자 요청). 짧은 드래그(=클릭/탭)는 벤치 앉기 판정 쪽에서
   dragMoved로 구분해서 쓴다. 초기값은 원래 오프셋(0, 2.4, 4.2)과 같은
   각도라 처음 보이는 모습은 그대로다. */
let camYaw = 0;
let camPitch = Math.atan2(2.4, 4.2);
const CAM_DIST = Math.hypot(2.4, 4.2);
const CAM_PITCH_MIN = 0.15, CAM_PITCH_MAX = 1.3;

let dragPointerId = null;
let dragLastX = 0, dragLastY = 0;
let dragMoved = 0;
const MOUSE_LOOK_SENS = 0.006;
renderer.domElement.style.touchAction = 'none'; // 드래그 중 브라우저 스크롤/줌 제스처와 충돌 방지
renderer.domElement.addEventListener('pointerdown', e=>{
  dragPointerId = e.pointerId;
  dragLastX = e.clientX; dragLastY = e.clientY;
  dragMoved = 0;
  renderer.domElement.setPointerCapture(dragPointerId);
});
renderer.domElement.addEventListener('pointermove', e=>{
  if(e.pointerId !== dragPointerId) return;
  const dx = e.clientX - dragLastX, dy = e.clientY - dragLastY;
  dragLastX = e.clientX; dragLastY = e.clientY;
  dragMoved += Math.hypot(dx, dy);
  camYaw -= dx * MOUSE_LOOK_SENS;
  camPitch = Math.min(CAM_PITCH_MAX, Math.max(CAM_PITCH_MIN, camPitch + dy*MOUSE_LOOK_SENS));
});
renderer.domElement.addEventListener('pointerup', e=>{ if(e.pointerId===dragPointerId) dragPointerId=null; });
renderer.domElement.addEventListener('pointercancel', e=>{ if(e.pointerId===dragPointerId) dragPointerId=null; });

function updateCamera(){
  const horizR = CAM_DIST * Math.cos(camPitch);
  const y = CAM_DIST * Math.sin(camPitch);
  camera.position.set(
    me.model.position.x + horizR * Math.sin(camYaw),
    me.model.position.y + y,
    me.model.position.z + horizR * Math.cos(camYaw)
  );
  camera.lookAt(me.model.position.x, me.model.position.y+1, me.model.position.z);
}

/* ---- 네트워킹 ----
   PeerJS 무료 브로커로 시그널링(최초 연결 중개)만 하고, 그 뒤론 P2P.
   docs/PLAN.md 3-a. */
const myIdEl = document.getElementById('myId');
const peerListEl = document.getElementById('peerList');
const nicknameDisplayEl = document.getElementById('nicknameDisplay');
const remoteAvatars = new Map(); // peerId -> {model, mixer, playState, targetPos, targetYaw, nameLabelEl}

/* ---- 닉네임 ----
   서버가 없어서 "먼저 자리 잡은 사람이 원래 이름을 쓴다"는 순서를 엄밀히
   보장은 못 한다(docs/PLAN.md 6-a에 적어둔 대로 이 프로젝트는 그 정도
   관대함을 기본값으로 한다) — 같은 방에서 남의 닉네임과 겹치는 걸 알게 되면
   그때 내 쪽에 "(2)"류 숫자를 붙여 재조정하고 새 이름을 다시 알린다. */
nicknameDisplayEl.textContent = myNickname; // myNickname은 main(myNickname) 파라미터
const usedNicknames = new Set(); // 남들이 쓰고 있는 걸로 확인된 닉네임

function renameMyNickname(newName){
  myNickname = newName;
  nicknameDisplayEl.textContent = myNickname;
  saveNickname(myNickname);
  if(me.nameLabelEl) me.nameLabelEl.textContent = myNickname;
  mesh.broadcast({type:'nickname', name: myNickname});
}

function resolveNicknameCollision(){
  if(!usedNicknames.has(myNickname)) return;
  let n = 2;
  while(usedNicknames.has(`${myNickname}(${n})`)) n++;
  renameMyNickname(`${myNickname}(${n})`);
}

document.getElementById('changeNicknameBtn').addEventListener('click', async ()=>{
  const name = await promptNickname(myNickname);
  usedNicknames.delete(myNickname);
  renameMyNickname(name);
  resolveNicknameCollision();
});

const mesh = createMesh({
  onPeerJoin: async (id)=>{
    updatePeerList();
    if(!remoteAvatars.has(id)){
      const av = await spawnAvatar();
      av.model.position.set(0,0,0);
      av.nameLabelEl = createNameLabel('…');
      remoteAvatars.set(id, {...av, targetPos:av.model.position.clone(), targetYaw:0});
    }
    // 새로 연결된 상대에게(그리고 김에 기존 상대들에게도) 내 닉네임/외형을 알린다.
    mesh.broadcast({type:'nickname', name: myNickname});
    mesh.broadcast({type:'appearance', appearance: myAppearance});
  },
  onPeerLeave: (id)=>{
    const av = remoteAvatars.get(id);
    if(av){
      scene.remove(av.model);
      if(av.nameLabelEl) av.nameLabelEl.remove();
      if(av.nickname) usedNicknames.delete(av.nickname);
      remoteAvatars.delete(id);
    }
    updatePeerList();
  },
  onData: (fromId, msg)=>{
    const av = remoteAvatars.get(fromId);
    if(!av) return;
    if(msg.type==='pos'){
      av.targetPos.set(msg.x, msg.y, msg.z);
      av.targetYaw = msg.yaw;
    } else if(msg.type==='state'){
      av.playState(msg.state);
      av.currentState = msg.state; // 벤치 좌석 점유 판정에 씀(아래 isSeatOccupied)
    } else if(msg.type==='nickname'){
      if(av.nickname) usedNicknames.delete(av.nickname);
      av.nickname = msg.name;
      usedNicknames.add(msg.name);
      if(av.nameLabelEl) av.nameLabelEl.textContent = msg.name;
      resolveNicknameCollision();
    } else if(msg.type==='appearance'){
      av.updateAppearance(msg.appearance);
    }
  },
});

function updatePeerList(){
  const ids = mesh.peers;
  peerListEl.textContent = '연결된 상대: ' + (ids.length ? ids.join(', ') : '없음');
}

/* ---- 방 자동 배정(오토 인스턴싱, docs/PLAN.md 6번) ----
   api/room.js(Vercel 서버리스 함수)가 방별 인원(최대 12명)을 추적해서 빈
   방을 배정해준다. 로컬 정적 서버(python3 -m http.server)나 아직 Redis
   연동 전인 배포에선 /api/room이 없거나 실패하는 게 정상이다 — 그럴 땐
   콘솔 경고만 남기고 조용히 넘어가서, 기존 수동 "상대 ID 붙여넣기"로
   계속 쓸 수 있게 한다(매칭 서버는 있으면 좋은 보강 기능이지 필수는 아님). */
const roomInfoEl = document.getElementById('roomInfo');
let myRoomId = null;

async function autoJoinRoom(myId){
  const r = await fetch('/api/room?action=join', {
    method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({peerId: myId}),
  });
  if(!r.ok) throw new Error('status '+r.status);
  const {roomId, peers} = await r.json();
  myRoomId = roomId;
  roomInfoEl.textContent = '방 #' + roomId;
  peers.forEach(id=>mesh.connectTo(id));
  startRoomHeartbeat();
}

function startRoomHeartbeat(){
  setInterval(()=>{
    if(!myRoomId) return;
    fetch('/api/room?action=heartbeat', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({peerId: mesh.peerId, roomId: myRoomId}),
    }).catch(()=>{}); // 실패해도 다음 하트비트가 또 오니 그냥 넘어간다
  }, 15000);

  addEventListener('pagehide', ()=>{
    if(!myRoomId) return;
    const blob = new Blob([JSON.stringify({peerId: mesh.peerId, roomId: myRoomId})],
      {type:'application/json'});
    navigator.sendBeacon('/api/room?action=leave', blob);
  });
}

mesh.ready().then(async id=>{
  myIdEl.textContent = id;
  // ?connect=<id> 로 열면 매칭 서버를 건너뛰고 그 상대에게 바로 연결(수동
  // 2탭 테스트, 또는 매칭 서버가 없는 환경에서의 디버깅용).
  const params = new URLSearchParams(location.search);
  const target = params.get('connect');
  if(target){ mesh.connectTo(target); roomInfoEl.textContent = '수동 연결 모드'; return; }
  try{
    await autoJoinRoom(id);
  }catch(err){
    roomInfoEl.textContent = '매칭 서버 없음(수동 연결만 가능)';
    console.warn('[hangout-lounge] 방 자동 배정 실패 — 로컬 개발/매칭 서버 미설정 환경일 수 있음:', err.message);
  }
});

document.getElementById('connectBtn').addEventListener('click', ()=>{
  const id = document.getElementById('remoteIdInput').value.trim();
  if(id) mesh.connectTo(id);
});

// 위치는 초당 ~10회만 보낸다(docs/PLAN.md 4번) — 매 프레임 보내면 과하다.
let posSendAcc = 0;
const POS_SEND_INTERVAL = 0.1; // 100ms = 초당 10회
function netSendPosMaybe(dt){
  posSendAcc += dt;
  if(posSendAcc < POS_SEND_INTERVAL) return;
  posSendAcc = 0;
  mesh.broadcast({type:'pos', x:me.model.position.x, y:me.model.position.y,
    z:me.model.position.z, yaw:me.model.rotation.y});
}
function netSendStateSoon(){
  mesh.broadcast({type:'state', state:myState});
}

/* ---- 남의 아바타 보간 ----
   마지막으로 받은 스냅샷(targetPos/targetYaw)을 향해 매 프레임 조금씩
   따라간다 — 뚝뚝 끊기지 않게(docs/PLAN.md 4번, 로블록스와 같은 원리). */
function updateRemoteAvatars(dt){
  const lerpT = Math.min(1, dt*10);
  remoteAvatars.forEach(av=>{
    av.model.position.lerp(av.targetPos, lerpT);
    // 각도는 최단 경로로 보간
    let dYaw = av.targetYaw - av.model.rotation.y;
    dYaw = Math.atan2(Math.sin(dYaw), Math.cos(dYaw));
    av.model.rotation.y += dYaw*lerpT;
  });
}

let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now-last)/1000, 0.1);
  last = now;

  updateMyAvatar(dt);
  updateRemoteAvatars(dt);
  updateCamera();
  netSendPosMaybe(dt);

  me.mixer.update(dt);
  remoteAvatars.forEach(av=>av.mixer.update(dt));

  updateLabelPosition(me.nameLabelEl, me.model);
  remoteAvatars.forEach(av=>{ if(av.nameLabelEl) updateLabelPosition(av.nameLabelEl, av.model); });

  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

} // main() 끝

getNickname().then(main).catch(err=>{
  console.error('[hangout-lounge] 초기화 실패:', err);
  document.getElementById('hint').textContent =
    '초기화 실패 — 콘솔 확인. (' + err.message + ')';
  document.getElementById('hint').style.color = '#f88';
});
</script>
