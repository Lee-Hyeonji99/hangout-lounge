<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>hangout-lounge</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#111;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}
  #hint{position:absolute;left:14px;top:14px;font-size:13px;color:#bbb;
    background:#0008;padding:8px 12px;border-radius:8px;pointer-events:none}
</style>
<script type="importmap">
{ "imports": { "three": "./lib/vendor/three/build/three.module.js" } }
</script>
</head>
<body>
<div id="hint">2단계: 리깅된 아바타 로드 — 1/2 키로 idle/walk 전환.
  docs/PLAN.md 8번 참고. (sit 클립은 이 모델에 없어서 아직 자세만 흉내)</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/vendor/three/examples/jsm/loaders/GLTFLoader.js';

/* ============================================================
   2단계 — docs/PLAN.md 8번. 1단계(캡슐 placeholder)에서 실제 리깅
   아바타로 교체. 원래 계획은 Quaternius였지만, 이 작업 환경의 네트워크
   프록시가 Quaternius/Kenney 등 에셋 사이트 도메인을 막고 있어서(조직
   정책 allowlist) 대신 **three.js 공식 예제 에셋(Soldier.glb, CC0)**을
   썼다 — GitHub raw 콘텐츠는 허용돼 있어서 mrdoob/three.js 저장소에서
   직접 받았다. 품질/신뢰도 면에서 손색없는 대안(three.js 자체 애니메이션
   스키닝 예제가 쓰는 바로 그 모델).

   Soldier.glb 는 Idle/Walk/Run/TPose 네 개 클립을 갖고 있고 sit 은 없다
   — sit 이 필요해지면(docs/PLAN.md 5번) 다른 리깅 소스를 찾아 교체하거나
   이 모델에 커스텀 클립을 하나 더 구워 넣어야 한다. 지금은 자리만 잡아둔다.
   ============================================================ */

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1e);
scene.fog = new THREE.Fog(0x1a1a1e, 10, 30);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2.2, 4.2);
camera.lookAt(0, 1, 0);

const hemi = new THREE.HemisphereLight(0xffffff, 0x333333, 1.2);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(3, 6, 4);
scene.add(key);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(8, 32),
  new THREE.MeshStandardMaterial({color:0x2a2a30, roughness:0.9})
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

/* ---- 아바타 로드 ---- */
const loader = new GLTFLoader();
let mixer = null;
const actions = {};
let currentAction = null;

function playState(name){
  const next = actions[name];
  if(!next || next===currentAction) return;
  next.reset().fadeIn(0.3).play();
  if(currentAction) currentAction.fadeOut(0.3);
  currentAction = next;
}

loader.load('./assets/avatars/soldier.glb', (gltf)=>{
  const model = gltf.scene;
  model.scale.setScalar(1.0);
  scene.add(model);

  mixer = new THREE.AnimationMixer(model);
  gltf.animations.forEach(clip=>{ actions[clip.name] = mixer.clipAction(clip); });
  console.log('로드된 애니메이션 클립:', Object.keys(actions));

  playState('Idle');
}, undefined, (err)=>{ console.error('아바타 로드 실패:', err); });

// 상태 이름 — 나중에 네트워크로는 이 이름 문자열만 오간다(docs/PLAN.md 4번).
// Soldier.glb 클립 이름(Idle/Walk)에 맞춰뒀다 — 다른 모델로 바꾸면 이 맵도 같이 바꾼다.
window.addEventListener('keydown', e=>{
  if(e.code==='Digit1') playState('Idle');
  if(e.code==='Digit2') playState('Walk');
});

let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now-last)/1000, 0.1);
  last = now;
  if(mixer) mixer.update(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
